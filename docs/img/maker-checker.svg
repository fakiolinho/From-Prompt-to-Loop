<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" role="img" aria-label="Two jobs. The maker wakes the agent, which works and opens a pull request. The checker then runs the same check on a clean machine with no agent, and you review the result.">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a645b"/>
    </marker>
    <style>
      .t   { font-family: "Instrument Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .h   { font-family: Unbounded, "Helvetica Neue", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #f1e4d8; }
      .k   { font-size: 13px; font-weight: 600; }
      .s   { font-size: 13px; fill: #d9c8bb; }
      .n   { font-size: 13px; fill: #a48d80; }
      .box { fill: #1c1210; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="780" height="320" rx="16" fill="#140c0b"/>

  <text class="t n" x="20" y="26" style="font-weight:700; fill:#d9a441">the check said exit 1, so there is work</text>

  <!-- maker -->
  <rect class="box" x="20" y="40" width="230" height="132" rx="10" stroke="#d9a441"/>
  <text class="t k" x="40" y="68" fill="#d9a441">Job 1: run</text>
  <text class="h"   x="40" y="94">The maker</text>
  <text class="t s" x="40" y="120">The agent wakes, fenced</text>
  <text class="t s" x="40" y="139">and capped. It does the work</text>
  <text class="t s" x="40" y="158">and opens one PR.</text>

  <path d="M250,106 L300,106" stroke="#7a645b" stroke-width="2" marker-end="url(#m)"/>
  <text class="t n" x="252" y="96" style="font-size:12px">branch</text>

  <!-- checker -->
  <rect class="box" x="302" y="40" width="230" height="132" rx="10" stroke="#86b86b"/>
  <text class="t k" x="322" y="68" fill="#86b86b">Job 2: verify</text>
  <text class="h"   x="322" y="94">The checker</text>
  <text class="t s" x="322" y="120">A clean machine. The same</text>
  <text class="t s" x="322" y="139">check, run again, with no</text>
  <text class="t s" x="322" y="158">agent anywhere near it.</text>

  <path d="M532,106 L582,106" stroke="#7a645b" stroke-width="2" marker-end="url(#m)"/>

  <!-- you -->
  <rect class="box" x="584" y="40" width="176" height="132" rx="10" stroke="#e6503d"/>
  <text class="t k" x="604" y="68" fill="#e6503d">The gate</text>
  <text class="h"   x="604" y="94">You</text>
  <text class="t s" x="604" y="120">Read the evidence.</text>
  <text class="t s" x="604" y="139">Ship, block, or</text>
  <text class="t s" x="604" y="158">send it back.</text>

  <!-- the point -->
  <rect x="20" y="200" width="740" height="98" rx="10" fill="#1c1210" stroke="#3a2622" stroke-width="1.5"/>
  <text class="h" x="44" y="234" style="font-size:15px">Why two jobs and not one</text>
  <text class="t n" x="44" y="260">An agent that runs its own check and calls itself done is grading its own homework.</text>
  <text class="t n" x="44" y="281">It shares its own blind spot. Job 2 costs pennies. It is what makes green mean green.</text>
</svg>
