<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" role="img" aria-label="Two jobs. The maker wakes the agent, which works and opens a pull request. The checker then runs the same check on a clean machine with no agent, and you review the result.">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .h  { font-size: 18px; font-weight: 700; fill: #fff; }
      .k  { font-size: 12px; font-weight: 700; letter-spacing: .09em; fill: #fff; opacity: .75; }
      .s  { font-size: 13px; fill: #e8eaf0; }
      .n  { font-size: 13px; fill: #a8b3c2; }
    </style>
  </defs>

  <text class="t n" x="20" y="24" style="font-weight:700; fill:#f59e0b">the check said exit 1, so there is work</text>

  <!-- maker -->
  <rect x="20" y="40" width="230" height="132" rx="12" fill="#3b82f6"/>
  <text class="t k" x="40" y="68">JOB 1</text>
  <text class="t h" x="40" y="94">run · the maker</text>
  <text class="t s" x="40" y="120">The agent wakes, fenced</text>
  <text class="t s" x="40" y="139">and capped. It does the work</text>
  <text class="t s" x="40" y="158">and opens one PR.</text>

  <path d="M250,106 L300,106" stroke="#94a3b8" stroke-width="2" marker-end="url(#m)"/>
  <text class="t n" x="252" y="96" style="font-size:12px">branch</text>

  <!-- checker -->
  <rect x="302" y="40" width="230" height="132" rx="12" fill="#10b981"/>
  <text class="t k" x="322" y="68" style="fill:#04301f; opacity:.85">JOB 2</text>
  <text class="t h" x="322" y="94" style="fill:#04301f">verify · the checker</text>
  <text class="t s" x="322" y="120" style="fill:#04301f; font-weight:600">A clean machine. The same</text>
  <text class="t s" x="322" y="139" style="fill:#04301f; font-weight:600">check, run again, with no</text>
  <text class="t s" x="322" y="158" style="fill:#04301f; font-weight:600">agent anywhere near it.</text>

  <path d="M532,106 L582,106" stroke="#94a3b8" stroke-width="2" marker-end="url(#m)"/>

  <!-- you -->
  <rect x="584" y="40" width="176" height="132" rx="12" fill="#8b5cf6"/>
  <text class="t k" x="604" y="68">THE GATE</text>
  <text class="t h" x="604" y="94">you</text>
  <text class="t s" x="604" y="120">Read the evidence.</text>
  <text class="t s" x="604" y="139">Ship, block, or</text>
  <text class="t s" x="604" y="158">send it back.</text>

  <!-- the point -->
  <rect x="20" y="200" width="740" height="98" rx="12" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="1.5"/>
  <text class="t" x="44" y="232" style="font-size:16px; font-weight:700; fill:#94a3b8">Why two jobs and not one</text>
  <text class="t n" x="44" y="258">An agent that runs its own check and calls itself done is grading its own homework.</text>
  <text class="t n" x="44" y="279">It shares its own blind spot. Job 2 costs pennies. It is what makes green mean green.</text>
</svg>
