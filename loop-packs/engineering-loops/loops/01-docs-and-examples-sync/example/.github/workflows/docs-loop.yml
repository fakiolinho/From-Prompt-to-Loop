name: docs-loop

# Trigger: the API changed (the real signal), plus a nightly safety net and manual runs.
on:
  push:
    paths: ["src/**"]
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
    inputs:
      agent:
        description: "which agent to run: claude or codex"
        default: "claude"

# The loop opens PRs, so it needs write. Nothing more.
permissions:
  contents: write
  pull-requests: write

# One run at a time. A push mid-run will not race a second agent on the same drift.
concurrency:
  group: docs-loop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # blast radius: a runaway run dies here, not on your bill
    steps:
      - uses: actions/checkout@v4
      - run: npm ci

      # The check has three answers, not two.
      #   no check-docs script: not wired. Fail loudly, and never wake an agent on a repo
      #                         the check cannot read. Nothing below runs.
      #   0: in sync. The job ends green, no tokens spent.
      #   1: drifted. Wake the agent.
      # The gate runs the same command as the hook and the standing orders, on purpose.
      - id: check
        run: |
          if ! node -e 'process.exit((require("./package.json").scripts||{})["check-docs"]?0:1)'; then
            echo "::error::no check-docs script, so nothing proves the docs match the code. Not wired, no agent."
            exit 2
          fi
          if npm run check-docs; then echo "answer=0" >> "$GITHUB_OUTPUT"; else echo "answer=1" >> "$GITHUB_OUTPUT"; fi

      - name: In sync, nothing to do
        if: steps.check.outputs.answer == '0'
        run: echo "docs match the code. No agent run, no tokens spent."

      # Only a check that ran and found drift wakes the agent. Scoped tools, capped turns, capped spend.
      - name: Sync with Claude
        if: steps.check.outputs.answer == '1' && github.event.inputs.agent != 'codex'
        run: |
          npx @anthropic-ai/claude-code -p "Read CLAUDE.md and memory/docs-loop.md. \
            Sync /docs and /examples to the API in /src. Run npm run check-docs until green. \
            Open or update the single PR on branch docs-loop/sync, never a second, and append one line to memory/docs-loop.md describing what drifted. \
            If you cannot map the API without guessing, open an issue and stop." \
            --allowedTools "Read,Edit,Write,Bash(npm:*),Bash(git:*),Bash(gh:*)" \
            --max-turns 30 \
            --max-budget-usd 2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Codex
        if: steps.check.outputs.answer == '1' && github.event.inputs.agent == 'codex'
        run: |
          npx @openai/codex exec --sandbox workspace-write "Read AGENTS.md and memory/docs-loop.md. \
            Sync /docs and /examples to the API in /src. Run npm run check-docs until green. \
            Open or update the single PR on branch docs-loop/sync, never a second, and append one line to memory/docs-loop.md describing what drifted. \
            If you cannot map the API without guessing, open an issue and stop."
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Note: to let the loop open PRs with the default GITHUB_TOKEN, enable
# Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# Or pass a fine-grained PAT or GitHub App token as GH_TOKEN instead.
