name: build-site

# Markdown is the source. This regenerates the HTML GitHub Pages serves, on every push
# to main, so editing a .md is all anyone has to do. Before this existed the docs job
# only *checked* whether the HTML was stale and failed if you forgot, which made a
# markdown-only change impossible without running the generator by hand first.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**.md'
      - 'docs/img/**'
      - 'README.md'
      - 'ci/build-site.py'
      - 'ci/build-wiring.py'
      - 'ci/guide-catalog.tsv'
      - 'ci/demo-output.txt'
      - 'loop-packs/*/LOOPS.md'
      - 'loop-packs/*/loops/*/check.sh'
  workflow_dispatch:

permissions:
  contents: write

# Never let two builds race for the same commit.
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet markdown-it-py pyyaml

      - name: Render the markdown
        run: |
          python3 ci/build-site.py
          python3 ci/build-wiring.py

      - name: Commit the result, if it changed
        run: |
          if git diff --quiet -- docs/ WIRING.md; then
            echo "The published site already matches the markdown. Nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ WIRING.md
          # The push below only touches generated files, and none of them are in this
          # workflow's paths filter, so it cannot trigger another run of itself.
          git commit -m "build: render the site from the markdown

          Generated by ci/build-site.py and ci/build-wiring.py. Edit the markdown,
          never these files."
          git push
          echo "Published site updated."
